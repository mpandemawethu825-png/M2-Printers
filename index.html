<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M² Printers Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .view-section { display: none; }
        .view-section.active { display: block; }
        .sidebar-link.active { background: rgba(37, 99, 235, 0.6); }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 to-blue-900 min-h-screen text-white font-sans">

    <div class="flex h-screen overflow-hidden">
        <aside class="w-64 glass p-6 flex flex-col">
            <h2 class="text-2xl font-bold mb-8 text-blue-300">M² Printers</h2>
            <nav class="space-y-2 flex-1">
                <a href="#" onclick="app.navigate('dashboard')" class="sidebar-link active block p-3 rounded transition" data-target="dashboard"><i class="fas fa-home mr-2"></i> Dashboard</a>
                <a href="#" onclick="app.navigate('sales')" class="sidebar-link block p-3 rounded transition" data-target="sales"><i class="fas fa-plus mr-2"></i> New Sale</a>
                <a href="#" onclick="app.navigate('transactions')" class="sidebar-link block p-3 rounded" data-target="transactions"><i class="fas fa-list mr-2"></i> Transactions</a>
                <a href="#" onclick="app.navigate('reports')" class="sidebar-link block p-3 rounded" data-target="reports"><i class="fas fa-chart-line mr-2"></i> Reports</a>
                <a href="#" onclick="app.navigate('services')" class="sidebar-link block p-3 rounded" data-target="services"><i class="fas fa-cog mr-2"></i> Services List</a>
                <a href="#" onclick="app.navigate('settings')" class="sidebar-link block p-3 rounded" data-target="settings"><i class="fas fa-tools mr-2"></i> Settings</a>
            </nav>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto">
            <div id="view-dashboard" class="view-section active">
                <h1 class="text-3xl font-bold mb-6">Dashboard</h1>
                <div class="glass p-6 rounded-2xl w-64">
                    <p class="text-blue-200">Today's Revenue</p>
                    <h3 class="text-3xl font-bold" id="kpi-today">R0.00</h3>
                </div>
            </div>

            <div id="view-sales" class="view-section">
                <h1 class="text-2xl font-bold mb-6">New Sale</h1>
                <div class="glass p-8 rounded-2xl max-w-md">
                    <form id="form-sale" onsubmit="app.sales.submit(event)">
                        <select id="sale-service" required class="w-full bg-slate-800 border-0 p-3 rounded mb-4"></select>
                        <input type="number" id="sale-qty" value="1" min="1" class="w-full bg-slate-800 p-3 rounded mb-4" oninput="app.sales.calculate()">
                        <input type="text" id="sale-total" class="w-full bg-blue-900/50 p-3 rounded mb-4 font-bold" readonly value="R0.00">
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 p-3 rounded font-bold">Process Sale</button>
                    </form>
                </div>
            </div>

            <div id="view-transactions" class="view-section">
                <h1 class="text-2xl font-bold mb-6">History</h1>
                <div class="glass p-6 rounded-2xl overflow-y-auto max-h-[500px]">
                    <table class="w-full text-left"><tbody id="tx-table"></tbody></table>
                </div>
            </div>

            <div id="view-reports" class="view-section">
                <h1 class="text-2xl font-bold mb-6">Reports</h1>
                <div class="glass p-6 rounded-2xl">
                    <div class="flex gap-4 mb-6">
                        <input type="date" id="rep-start" class="bg-slate-800 p-2 rounded">
                        <input type="date" id="rep-end" class="bg-slate-800 p-2 rounded">
                        <button onclick="app.reports.downloadPDF()" class="bg-red-600 px-4 py-2 rounded">PDF</button>
                        <button onclick="app.reports.copyWhatsApp()" class="bg-green-600 px-4 py-2 rounded">WhatsApp Report</button>
                    </div>
                </div>
            </div>

            <div id="view-services" class="view-section">
                <h1 class="text-2xl font-bold mb-6">Service Price List</h1>
                <div class="glass p-6 rounded-2xl max-h-[500px] overflow-y-auto">
                    <table class="w-full text-left" id="services-list"></table>
                </div>
            </div>

            <div id="view-settings" class="view-section">
                <h1 class="text-2xl font-bold mb-6">Settings</h1>
                <button onclick="app.backup.factoryReset()" class="bg-red-800 text-white px-6 py-3 rounded"><i class="fas fa-trash"></i> FACTORY RESET (DELETE ALL DATA)</button>
            </div>
        </main>
    </div>

    <script>
        const fullServiceList = [
            { cat: 'Printing', name: 'B&W Printing', price: 2.50 },
            { cat: 'Printing', name: 'B&W Photocopying', price: 2.50 },
            { cat: 'Printing', name: 'Colour Printing', price: 4.00 },
            { cat: 'CV', name: 'CV Writing', price: 20 },
            { cat: 'CV', name: 'CV Printing', price: 20 },
            { cat: 'CV', name: 'CV + Cover Letter', price: 30 },
            { cat: 'CV', name: 'CV (Word + PDF)', price: 75 },
            { cat: 'CV', name: 'CV + Cover Letter (Word+PDF)', price: 95 },
            { cat: 'CV', name: 'CV + Cover Letter + Attachments', price: 150 },
            { cat: 'CV', name: 'Indeed Profile + CV', price: 180 },
            { cat: 'CV', name: 'LinkedIn Profile + CV', price: 180 },
            { cat: 'CV', name: 'Indeed + LinkedIn + CV', price: 250 },
            { cat: 'Scanning', name: 'Scan to Phone', price: 3 },
            { cat: 'Scanning', name: 'Scan to Email/USB/PDF', price: 5 },
            { cat: 'Funeral', name: 'Single Programme', price: 5.50 },
            { cat: 'Funeral', name: '50 Programmes', price: 300 },
            { cat: 'Education', name: 'University Apps (3 Inst)', price: 90 },
            { cat: 'Education', name: 'University Apps (5 Inst)', price: 150 },
            { cat: 'Education', name: 'NSFAS Application', price: 50 },
            { cat: 'Tech', name: 'Antivirus Install', price: 250 },
            { cat: 'Tech', name: 'Windows Install', price: 450 },
            { cat: 'Tech', name: 'Office Install', price: 300 },
            { cat: 'Tech', name: 'Cleanup & Optimization', price: 250 },
            { cat: 'Design', name: 'Logo Design', price: 200 },
            { cat: 'Design', name: 'AI Flyer / Poster', price: 150 },
            { cat: 'Design', name: 'Manual Flyer / Poster', price: 200 },
            { cat: 'Design', name: 'Invitation Design', price: 200 },
            { cat: 'Design', name: 'Marriage Invitation', price: 150 },
            { cat: 'Design', name: 'Invitation Video', price: 250 },
            { cat: 'Design', name: 'Social Media Post', price: 75 },
            { cat: 'Business', name: 'Company Registration', price: 300 },
            { cat: 'Business', name: 'Business Profile Creation', price: 500 }
        ];

        const app = {
            data: { services: [], sales: [] },
            init() {
                this.data.services = JSON.parse(localStorage.getItem('m2_services')) || fullServiceList;
                this.data.sales = JSON.parse(localStorage.getItem('m2_sales')) || [];
                this.navigate('dashboard');
                this.updateUI();
            },
            saveData() {
                localStorage.setItem('m2_services', JSON.stringify(this.data.services));
                localStorage.setItem('m2_sales', JSON.stringify(this.data.sales));
            },
            navigate(view) {
                document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
                document.querySelectorAll('.sidebar-link').forEach(el => el.classList.remove('active'));
                document.getElementById('view-' + view).classList.add('active');
                document.querySelector(`[data-target="${view}"]`).classList.add('active');
            },
            sales: {
                populate() {
                    const sel = document.getElementById('sale-service');
                    sel.innerHTML = '<option value="">Select Service</option>';
                    app.data.services.forEach((s, i) => sel.innerHTML += `<option value="${i}">${s.name} - R${s.price.toFixed(2)}</option>`);
                },
                calculate() {
                    const s = app.data.services[document.getElementById('sale-service').value];
                    const qty = document.getElementById('sale-qty').value;
                    if(s) document.getElementById('sale-total').value = `R${(s.price * qty).toFixed(2)}`;
                },
                submit(e) {
                    e.preventDefault();
                    const s = app.data.services[document.getElementById('sale-service').value];
                    app.data.sales.push({ name: s.name, total: s.price * document.getElementById('sale-qty').value, timestamp: Date.now() });
                    app.saveData();
                    app.updateUI();
                    alert('Sale Saved!');
                }
            },
            updateUI() {
                this.sales.populate();
                // Render Services
                const sTable = document.getElementById('services-list');
                sTable.innerHTML = '';
                this.data.services.forEach(s => sTable.innerHTML += `<tr><td class="py-2 text-blue-300">${s.cat}</td><td class="py-2">${s.name}</td><td class="py-2 text-right">R${s.price.toFixed(2)}</td></tr>`);
                // Render Transactions
                const tTable = document.getElementById('tx-table');
                tTable.innerHTML = '';
                this.data.sales.forEach(s => tTable.innerHTML += `<tr><td class="py-2">${s.name}</td><td class="py-2 text-right">R${s.total.toFixed(2)}</td></tr>`);
                const todayRev = this.data.sales.filter(s => new Date(s.timestamp).toDateString() === new Date().toDateString()).reduce((a,b) => a + b.total, 0);
                document.getElementById('kpi-today').textContent = `R${todayRev.toFixed(2)}`;
            },
            reports: {
                downloadPDF() {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();
                    doc.text("Sales Report", 10, 10);
                    let rows = app.data.sales.map(s => [s.name, `R${s.total}`]);
                    doc.autoTable({ head: [['Service', 'Total']], body: rows });
                    doc.save("Report.pdf");
                },
                copyWhatsApp() {
                    let msg = "M² Printers Report:\n";
                    app.data.sales.forEach(s => msg += `${s.name}: R${s.total}\n`);
                    navigator.clipboard.writeText(msg).then(() => alert("Copied!"));
                },
                clearRange() {
                    const start = new Date(document.getElementById('rep-start').value).getTime();
                    const end = new Date(document.getElementById('rep-end').value).getTime() + 86400000;
                    app.data.sales = app.data.sales.filter(s => !(s.timestamp >= start && s.timestamp <= end));
                    app.saveData();
                    app.updateUI();
                    alert('Cleared.');
                }
            },
            backup: { factoryReset() { if(confirm('Delete ALL data?')) { localStorage.clear(); location.reload(); } } }
        };
        app.init();
    </script>
</body>
</html>
